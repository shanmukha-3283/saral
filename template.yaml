AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Saral — explains official documents in regional languages

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Google AI Studio API key for the Gemini model call (never commit it)

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        RESULTS_TABLE: !Ref ResultsTable
        CACHE_TABLE: !Ref CacheTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        GEMINI_MODEL: gemini-3.7-flash,gemini-3.6-flash,gemini-3.8-flash
        GEMINI_API_KEY: !Ref GeminiApiKey

Resources:
  SaralHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['GET', 'POST', 'OPTIONS']
        AllowHeaders: ['Content-Type']

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: dist/lambda.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref SaralHttpApi
            Path: /health
            Method: GET
        Explain:
          Type: HttpApi
          Properties:
            ApiId: !Ref SaralHttpApi
            Path: /explain
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter24h
            Status: Enabled
            ExpirationInDays: 1

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: saral-results
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: saral-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: docHash
          AttributeType: S
      KeySchema:
        - AttributeName: docHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub 'https://${SaralHttpApi}.execute-api.${AWS::Region}.amazonaws.com/'
  WebUrl:
    Description: Production URL of the web app (S3 static website)
    Value: !GetAtt WebBucket.WebsiteURL
  WebBucketName:
    Description: S3 bucket hosting the web build
    Value: !Ref WebBucket
  UploadsBucketName:
    Value: !Ref UploadsBucket
  ResultsTableName:
    Value: !Ref ResultsTable
  CacheTableName:
    Value: !Ref CacheTable
